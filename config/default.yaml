# SYNESTHESIA default configuration (schema v1).
# Every tunable number lives here. Code reads it through src/synesthesia/config.py.
# The canonical-JSON SHA-256 of the resolved config is stored in every output.
# Changing any value changes the config hash; changing a default needs a DECISIONS entry.

schema_version: 1
seed: 20261010

ingest:
  sample_rate: 22050            # Hz, analysis rate
  resampler: soxr_hq            # deterministic resampler
  mono: mean                    # average channels
  target_lufs: -23.0            # EBU R128 integrated loudness after normalization
  peak_ceiling_dbfs: -1.0       # limit gain so true peak stays below this
  trim_silence_dbfs: -60.0      # trim leading/trailing audio below this level
  min_duration_s: 20.0
  max_duration_s: 720.0         # 12 minutes
  max_file_mb: 100
  silent_lufs: -60.0            # below this integrated loudness -> E_SILENT
  formats: [wav, flac, mp3, m4a, aac, ogg, opus]

frames:
  n_fft: 2048
  hop: 512                      # ≈ 23.2 ms at 22,050 Hz → ≈ 43.07 frames/s
  window: hann
  n_mels: 64
  fmin_hz: 30
  fmax_hz: 11025
  smooth_frames: 9              # centered moving average for SOM/live features (≈ 0.2 s)
  max_som_frames: 16384         # deterministic uniform stride above this

features:
  mfcc:
    n_mfcc: 14                  # compute c0..c13
    use: [1, 13]                # keep c1..c13 (13 dims); drop c0 (loudness lives elsewhere)
  centroid: {log: true}         # log10 Hz
  loudness: {unit: rms_dbfs}
  noisiness: {measure: spectral_flatness, log: true}
  harmonicity: {method: hpss, margin: 2.0, kernel_size: 31}   # H^2 / total energy per frame (D-016)
  change:
    window_s: 0.5               # compare mean vector of previous vs next 0.5 s
  onset: {aggregate: median}

layout:
  # Per-song z-scoring, then block weights (each block's total contribution).
  standardize: zscore_per_song
  block_weights:
    timbre: 0.50                # MFCC c1..c13, divided by sqrt(13) per dim
    brightness: 0.15
    loudness: 0.15
    noisiness: 0.10
    change: 0.10
  # D = 13 + 1 + 1 + 1 + 1 = 17

grid:
  size: 64                      # locked; 32/40/100 only in compare-sizes experiments
  topology: planar

som:
  algorithm: batch
  init: pca                     # PCA components with sign fixed (largest |loading| positive)
  epochs: 40
  sigma_start: 16.0             # neighborhood radius in cells
  sigma_end: 1.0
  sigma_decay: exponential
  neighborhood: gaussian
  dtype: float64
  frame_chunk: 2048             # frames per distance block (memory bound)

orientation:
  enabled: true
  up_feature: brightness        # brighter prototypes toward the top
  right_feature: loudness       # louder prototypes toward the right

occupancy:
  kernel_sigma_cells: 1.5       # Gaussian smoothing of hit counts on the map
  gamma: 0.5                    # occ_norm = (occ / max) ** gamma
  empty_threshold: 0.02         # below this occ_norm a cell is "empty"

color:
  space: oklch
  # Global ranges: placeholders until M2 calibration writes config/calibration.yaml
  # (2nd/98th percentiles over the 30-track corpus), then frozen.
  ranges:
    centroid_log10_hz: [2.398, 3.699]     # 250 Hz .. 5,000 Hz
    loudness_dbfs: [-50.0, -5.0]
    noisiness_log10: [-4.0, -0.3]
    harmonicity: [0.0, 1.0]
    change_z: [0.0, 3.0]
  hue:
    from_deg: 265               # t = 0 (dark timbre)
    to_deg: 30                  # t = 1 (bright timbre)
    valence_blend: 0.0          # 0.2 once the M10 emotion model is validated
  lightness:
    min: 0.22
    max: 0.82                   # D-026 (spec 0.86)
    occupancy_weight: 0.6
    loudness_weight: 0.4
    empty_L: 0.16
    empty_chroma_factor: 0.35
  chroma:
    min: 0.08                  # D-025 (D-018 had 0.06, spec 0.03)
    max: 0.24                  # D-025 (D-018 had 0.20, spec 0.18)
  gamut: srgb_chroma_bisect     # reduce chroma until in sRGB, 24 bisection steps
  display_smoothing_sigma: 0.6  # light Gaussian on lightness only, in cells; 0 disables

maps:
  feature_grids: [brightness, loudness, noisiness, harmonicity, change]
  structure:
    block_s: 0.5
    features: [chroma, mfcc]
    size: 256
    similarity: cosine
  rhythm:
    tempogram_win_frames: 384   # ≈ 8.9 s
    bpm_min: 40
    bpm_max: 240
    bpm_bins: 128               # log-spaced
    time_cols: 256
    start_bpm: 120
  dynamics:
    envelope_points: 1024
    hist_bins: 40
    hist_range_dbfs: [-60.0, 0.0]
    short_term_s: 3.0
    lra_percentiles: [10, 95]

fingerprint:
  version: 1
  hist_bins: 16                 # per color feature, over the global ranges
  hue_bins: 12
  lightness_bins: 4
  # length = 5*16 + 12*4 + 5 scalars = 133

live:
  fps: 43.066                   # = sample_rate / hop
  tau_target_share: 0.04        # tau so that, at the median frame, this share of cells has r >= 0.5 (D-024)
  tau_sample_frames: 1024       # frames sampled (deterministic stride) to estimate tau
  tau_scale: 1.0                # multiplier on that tau (spec: tau = tau_scale * median BMU distance)
  beat_latency_s: 0.020         # onset-envelope peaks trail sharp clicks by ~20 ms (measured, M3)
  blur_renormalize: true        # rescale the loudness blur so its peak stays 1 (D-024; spec: off)
  attack_ms: 40
  release_ms: 250
  diffusion_rate: 0.20
  diffusion_passes: 2
  glow_sigma_cells: [1.0, 3.0]  # quiet .. loud
  live_mix_max: 0.85            # max blend from static color to live color
  max_lightness: 0.86           # clamp on live lightness (D-026; spec 0.95 pushed bright regions to white)
  live_lightness_boost: 0.18    # D-025 (spec 0.30: the bloom went white instead of colored)
  global_mix: 0.40              # whole-grid blend toward the current frame's hue/chroma (D-025)
  global_lightness_swing: 0.16  # whole-grid lightness swing with loudness, +- this * (loud - 0.5) * 2
  live_chroma_gain: 1.4         # multiplies live chroma before gamut mapping (D-025)
  ripple:
    onset_threshold: 0.35       # normalized onset strength
    speed_cells_per_s: 24
    decay_s: 0.6
    width_cells: 1.5
    amplitude: 0.5
    max_concurrent: 8
  trail:
    length_s: 2.0
    width_cells: 0.8
    opacity: 0.30               # peak brightness of the BMU trail (D-025; was a fixed 0.55)
  reduced_motion:
    ripples: false
    diffusion: false
    release_ms: 500
  glass:                        # chip swirl behaviour in live mode (render.glass.mode: chip)
    swirl_flow_gain: 0.90       # extra swirl angle (radians) per unit of the smooth response field
    swirl_loud_gain: 0.35       # extra swirl angle (radians) per unit of normalized loudness
    swirl_drift_hz: 0.18        # slow rotation of the swirl phase, scaled by the response
    reduced_motion: static      # static | flat: swirl frozen (or flat chips) under reduced motion
  flow:                         # river-ripple motion: damped 2D wave equation + gentle current (visual layer)
    enabled: true
    wave_speed: 13.0            # cells per second
    damping: 1.5                # 1/s
    substeps: 4                 # simulation steps per display frame
    source_gain: 0.85           # continuous emission at the best-matching cell x loudness
    source_sigma_cells: 1.3
    beat_gain: 1.60             # impulse of a beat ring (existing ripple logic, tempo-synced)
    current_dir: [1.0, 0.0]     # drift direction (default left to right)
    current_speed: 2.6          # cells per second at loudness 0.5
    current_loud_gain: 1.2      # speed scales with loudness
    curl_amp: 0.30              # curl-noise share of the current (deterministic)
    curl_scale: 0.11            # curl noise frequency (1/cells)
    mod_transmission: 0.12      # wave height -> transmission (relative lightness), bounded
    mod_vibrance: 0.18          # wave height -> vibrance (relative chroma), bounded
    mod_radius: 0.15            # wave height -> radius swell, +-
    slope_glint_gain: 0.90      # wave slope -> glint travel
    wave_limit: 1.0             # |height| clamp
    reduced_motion: follow      # follow | static: no waves or advection; simple transmission follow

render:
  export_px: [2048, 4096, 8192]
  preview_px: 1024
  margin_cells: 1.0
  dot_radius_ratio: 0.34        # dot radius / cell pitch
  glow_sigma_ratio: 0.30        # glow blur sigma / cell pitch (D-018; D-017 had 0.25, spec 0.50)
  glow_opacity: 0.30            # D-026 (D-018 had 0.45, D-017 0.35, spec 0.60)
  background: "#000000"
  caption: {enabled: false, font: system}
  glass:                        # display layer: 32 x 32 translucent glass chips over the 64 x 64 analysis
    mode: flat                  # flat | chip   (flat = the 64 x 64 dots; chip = translucent glass chips)
    display_block: 2            # analysis cells per chip side (2 -> 32 x 32 chips)
    radius_mode: constant       # constant | occupancy (+-radius_occ_amount of the AREA from occupancy)
    chip_radius: 0.43           # chip radius in pitch units (constant mode, no overlap)
    radius_occ_amount: 0.10     # occupancy variant: area varies by +-this fraction
    radius_min: 0.30            # hard bounds, pitch units
    radius_max: 0.50
    overlap: 0.0                # 0 = lead gaps; >0 = neighbors overlap and blend multiplicatively
    overlap_radius: 0.54        # chip radius used when overlap > 0 (pitch units)
    overlap_radius_max: 0.58
    overlap_lightness_comp: 0.013   # lightens chips to offset the multiplicative darkening where they overlap
    swirl_angle_deg: 35.0       # peak rotation of the colour field at the chip centre (static)
    swirl_falloff_power: 2.0    # angle(s) = peak * (1 - s)^power, s = r / chip radius
    absorb_edge_dark: 0.06      # centre lighter / edge denser (mean-preserving)
    absorb_edge_sat: 0.30       # edge more saturated (mean-preserving)
    edge_ring_start: 0.78       # thick-glass edge ring starts here (fraction of the radius)
    edge_ring_dark: 0.20        # extra density in the ring (mean-preserving)
    edge_ring_sat: 0.28         # extra saturation in the ring (mean-preserving)
    edge_directional: 0.70      # ring denser on the lit side, lighter on the far side (zero-mean in angle)
    grain: 0.010                # fine glass grain (relative lightness, mean zero)
    veins: 0.010                # faint veins steered by the sub-cell colours (mean zero)
    vein_scale: 3.2             # vein frequency in radii
    backlight: 1.00             # light behind the chips
    haze_strength: 0.0          # large-scale backdrop haze (blurred cell colours); variant C
    haze_sigma_cells: 3.0
    glint_strength: 0.14        # one small soft neutral glint (rim sliver), top-left
    glint_size: 0.07            # sliver half-width, in chip radii
    glint_offset: 0.90          # radial position of the sliver, in chip radii
    light_dir: [-0.50, -0.65, 0.57]   # direction used for the glint (x right, y down)
    exposure: 1.00
    bloom_strength: 0.04        # backlight bloom (restrained)
    bloom_sigma: 0.50           # in chip pitches
    dither: 1.0
    color_space: srgb           # srgb | display-p3
    chroma_ceiling: 0.24
    chroma_ceiling_p3: 0.30
    flat_fallback: true         # reduced transparency / weak GPU -> flat dots

preview:
  fps: 30
  px: 1080                      # output side in pixels (docs/LIVE.md section 6)
  default_seconds: 20
  codec: h264
  crf: 18
  audio_kbps: 192

api:
  storage_dir: storage
  keep_audio: false             # delete uploads after analysis
  retention_days: 30            # analysis outputs of anonymous uploads
  max_concurrent_jobs: 1
  job_timeout_s: 300

performance:
  budget_analysis_s_per_4min: 30   # on an Apple M1 / 8 GB or comparable x86
  budget_peak_ram_gb: 1.5
  target_fps: 60
