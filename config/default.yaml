# SYNESTHESIA default configuration (schema v1).
# Every tunable number lives here. Code reads it through src/synesthesia/config.py.
# The canonical-JSON SHA-256 of the resolved config is stored in every output.
# Changing any value changes the config hash; changing a default needs a DECISIONS entry.

schema_version: 1
seed: 20261010

ingest:
  sample_rate: 22050            # Hz, analysis rate
  resampler: soxr_hq            # deterministic resampler
  mono: mean                    # average channels
  target_lufs: -23.0            # EBU R128 integrated loudness after normalization
  peak_ceiling_dbfs: -1.0       # limit gain so true peak stays below this
  trim_silence_dbfs: -60.0      # trim leading/trailing audio below this level
  min_duration_s: 20.0
  max_duration_s: 720.0         # 12 minutes
  max_file_mb: 100
  decode_timeout_s: 120.0       # ffmpeg / ffprobe subprocess timeout
  silent_lufs: -60.0            # below this integrated loudness -> E_SILENT
  formats: [wav, flac, mp3, m4a, aac, ogg, opus]

frames:
  n_fft: 2048
  hop: 512                      # ≈ 23.2 ms at 22,050 Hz → ≈ 43.07 frames/s
  window: hann
  n_mels: 64
  fmin_hz: 30
  fmax_hz: 11025
  smooth_frames: 9              # centered moving average for SOM/live features (≈ 0.2 s)
  max_som_frames: 16384         # deterministic uniform stride above this

features:
  mfcc:
    n_mfcc: 14                  # compute c0..c13
    use: [1, 13]                # keep c1..c13 (13 dims); drop c0 (loudness lives elsewhere)
  chroma: {n_chroma: 12}        # pitch classes (structure map only)
  centroid: {log: true}         # log10 Hz
  loudness: {unit: rms_dbfs}
  noisiness: {measure: spectral_flatness, log: true}
  harmonicity: {method: hpss, margin: 2.0, kernel_size: 31}   # H^2 / total energy per frame (D-016)
  change:
    window_s: 0.5               # compare mean vector of previous vs next 0.5 s
  onset: {aggregate: median}

layout:
  # Per-song z-scoring, then block weights (each block's total contribution).
  standardize: zscore_per_song
  block_weights:
    timbre: 0.50                # MFCC c1..c13, divided by sqrt(13) per dim
    brightness: 0.15
    loudness: 0.15
    noisiness: 0.10
    change: 0.10
  # D = 13 + 1 + 1 + 1 + 1 = 17

grid:
  size: 64                      # locked; 32/40/100 only in compare-sizes experiments
  topology: planar

som:
  algorithm: batch
  init: pca                     # PCA components with sign fixed (largest |loading| positive)
  epochs: 40
  sigma_start: 16.0             # neighborhood radius in cells
  sigma_end: 1.0
  sigma_decay: exponential
  neighborhood: gaussian
  dtype: float64
  frame_chunk: 2048             # frames per distance block (memory bound)

orientation:
  enabled: true
  up_feature: brightness        # brighter prototypes toward the top
  right_feature: loudness       # louder prototypes toward the right

occupancy:
  kernel_sigma_cells: 1.5       # Gaussian smoothing of hit counts on the map
  gamma: 0.5                    # occ_norm = (occ / max) ** gamma
  empty_threshold: 0.02         # below this occ_norm a cell is "empty"

color:
  space: oklch
  # Global ranges: placeholders until M2 calibration writes config/calibration.yaml
  # (2nd/98th percentiles over the 30-track corpus), then frozen.
  ranges:
    centroid_log10_hz: [2.398, 3.699]     # 250 Hz .. 5,000 Hz
    loudness_dbfs: [-50.0, -5.0]
    noisiness_log10: [-4.0, -0.3]
    harmonicity: [0.0, 1.0]
    change_z: [0.0, 3.0]
  hue:
    from_deg: 265               # t = 0 (dark timbre)
    to_deg: 30                  # t = 1 (bright timbre)
    valence_blend: 0.0          # 0.2 once the M10 emotion model is validated
  lightness:
    min: 0.22
    max: 0.82                   # D-026 (spec 0.86)
    occupancy_weight: 0.6
    loudness_weight: 0.4
    empty_L: 0.16
    empty_chroma_factor: 0.35
  chroma:
    min: 0.08                  # D-025 (D-018 had 0.06, spec 0.03)
    max: 0.24                  # D-025 (D-018 had 0.20, spec 0.18)
  gamut: srgb_chroma_bisect     # reduce chroma until in sRGB, 24 bisection steps
  emotion:                      # D-036: per-song valence / arousal offsets (model: config/emotion_model.json)
    enabled: false
    gain_lightness: 0.0         # lightness += gain * valence
    gain_chroma: 0.0            # chroma += gain * (valence + arousal) / 2
    gain_hue: 0.0               # palette position += gain * valence (toward warm for positive)
  display_smoothing_sigma: 0.6  # light Gaussian on lightness only, in cells; 0 disables

maps:
  feature_grids: [brightness, loudness, noisiness, harmonicity, change]
  ramp_hues:                    # one hue per feature grid, fixed dark -> light ramp (D-031)
    brightness: {hue_deg: 60}
    loudness: {hue_deg: 330}
    noisiness: {hue_deg: 200}
    harmonicity: {hue_deg: 150}
    change: {hue_deg: 20}
  ramp: {lightness: [0.18, 0.86], chroma: 0.13}
  structure:
    block_s: 0.5
    features: [chroma, mfcc]
    size: 256
    similarity: cosine
  rhythm:
    tempogram_win_frames: 384   # ≈ 8.9 s
    bpm_min: 40
    bpm_max: 240
    bpm_bins: 128               # log-spaced
    time_cols: 256
    start_bpm: 120
    tempo_refine_tolerance: 0.15  # beats within +-15% of the estimated period refine the tempo (D-031)
    tempo_refine_min_beats: 4
  dynamics:
    envelope_points: 1024
    hist_bins: 40
    hist_range_dbfs: [-60.0, 0.0]
    short_term_s: 3.0
    lra_percentiles: [10, 95]

fingerprint:
  version: 1
  hist_bins: 16                 # per color feature, over the global ranges
  hue_bins: 12
  lightness_bins: 4
  # length = 5*16 + 12*4 + 5 scalars = 133

live:
  fps: 43.066                   # = sample_rate / hop
  tau_target_share: 0.04        # tau so that, at the median frame, this share of cells has r >= 0.5 (D-024)
  tau_sample_frames: 1024       # frames sampled (deterministic stride) to estimate tau
  tau_scale: 1.0                # multiplier on that tau (spec: tau = tau_scale * median BMU distance)
  beat_latency_s: 0.020         # onset-envelope peaks trail sharp clicks by ~20 ms (measured, M3)
  blur_renormalize: true        # rescale the loudness blur so its peak stays 1 (D-024; spec: off)
  attack_ms: 40
  release_ms: 250
  diffusion_rate: 0.20
  diffusion_passes: 2
  glow_sigma_cells: [1.0, 3.0]  # quiet .. loud
  live_mix_max: 0.85            # max blend from static color to live color
  max_lightness: 0.86           # clamp on live lightness (D-026; spec 0.95 pushed bright regions to white)
  live_lightness_boost: 0.18    # D-025 (spec 0.30: the bloom went white instead of colored)
  global_mix: 0.40              # whole-grid blend toward the current frame's hue/chroma (D-025)
  global_lightness_swing: 0.16  # whole-grid lightness swing with loudness, +- this * (loud - 0.5) * 2
  live_chroma_gain: 1.4         # multiplies live chroma before gamut mapping (D-025)
  ripple:
    onset_threshold: 0.35       # normalized onset strength
    speed_cells_per_s: 24
    decay_s: 0.6
    width_cells: 1.5
    amplitude: 0.5
    max_concurrent: 8
  trail:
    length_s: 2.0
    width_cells: 0.8
    opacity: 0.30               # peak brightness of the BMU trail (D-025; was a fixed 0.55)
  reduced_motion:
    ripples: false
    diffusion: false
    release_ms: 500

web3d:                          # the 3D live view (D-045, D-046, D-056); not part of the frozen 2D render
  live_view_version: 3          # bump whenever a live-view or 3D parameter changes (MILESTONES M7b freeze rules); 3 = D-058 flat chips + trail
  camera_fov_deg: 15.0          # narrow field of view; the camera looks straight on, so the layout matches the 2D view
  chip_size: 0.84               # chip side / node pitch (gap 0.16 pitch: the dark lead lines)
  chip_thickness: 0.18          # / pitch
  chip_corner: 0.12             # rounded edge radius / pitch: the bevelled rim, the only place lighting may act
  absorb_edge: 0.18             # face lightness falloff toward the edge (mean-preserving, D-029)
  absorb_edge_sat: 0.12         # edge chroma gain (denser glass at the rim)
  grain: 0.012                  # deterministic face grain amplitude (zero-mean)
  glint: 0.06                   # rim highlight, added on the bevel only, capped
  side_shade: 0.55              # chip sides are this much darker than the face
  trail_opacity: 0.45           # the BMU trail (D-057): a faint line of light floating over the chips, peak brightness ...
  trail_width: 0.40             # ... width in pitch (soft falloff) ...
  trail_lift: 0.60              # ... and height above the chip faces in pitch
  parallax_deg: 3.0             # pointer parallax, max
  parallax_response_s: 0.5      # critically damped spring response
  max_dpr: 2.0
  disc:                         # the rotating disc in the player bar (phase 4, D-060); size: CSS --disc-size
    rpm: 33.333                 # steady rate; while playing at speed the angle advances with audio time (dtheta/ds)
    spin_response_s: 0.6        # play / pause: spin up and coast down on a critically damped spring
    seek_response_s: 0.3        # a seek or scrub turns the disc by omega x jump (under one turn, same direction) on this spring
    seek_threshold_s: 0.05      # audio-time jumps larger than this (vs wall time) count as a seek
    tilt_deg: 12.0              # camera tilt from straight above, so the rim and thickness read
    camera_fov_deg: 20.0
    thickness: 0.035            # / radius
    label_ratio: 0.66           # label radius / disc radius; the signature card is inscribed in the label
    spindle_ratio: 0.035        # spindle radius / disc radius
    rim_ratio: 0.03             # polished rim width / disc radius
    body_level: 0.012           # smoked-glass body, linear grey level (near black)
    groove_cycles: 28.0         # groove rings across the groove band (faded where finer than a pixel)
    groove_depth: 0.35          # groove contrast on the body and the sheen
    track_gaps: [0.77, 0.85, 0.92]   # radii of the smooth bands between tracks
    sheen: 0.10                 # anisotropic sheen peak (the fixed "bow tie" across the grooves)
    sheen_power: 18.0
    light_angle_deg: 135.0      # sheen direction on screen (0 = right, 90 = up)
    rim_level: 0.45             # rim highlight peak

render:
  export_px: [2048, 4096, 8192]
  preview_px: 1024
  display_grid: 32              # nodes drawn per side; the 64 x 64 analysis is mean-pooled to this (D-030)
  margin_cells: 1.0             # in display nodes
  node:                         # the look of one node; swap by changing `style` (D-030)
    style: dot                  # dot | (future styles register in src/synesthesia/nodes.py)
    dot:
      radius_ratio: 0.41        # dot radius / node pitch (D-055; was 0.34)
      glow_sigma_ratio: 0.24    # glow blur sigma / node pitch (D-055; D-018 had 0.30, D-017 0.25)
      glow_opacity: 0.30        # D-026 (D-018 had 0.45, D-017 0.35, spec 0.60)
  background: "#000000"
  caption: {enabled: false, font: system}

preview:
  fps: 30
  px: 1080                      # output side in pixels (docs/LIVE.md section 6)
  default_seconds: 20
  codec: h264
  crf: 18
  audio_kbps: 192

api:
  storage_dir: storage
  keep_audio: false             # delete uploads after analysis
  retention_days: 30            # analysis outputs of anonymous uploads
  max_concurrent_jobs: 1
  job_timeout_s: 300
  rate_limit_per_hour: 10       # analyses per client per hour (token bucket)
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
  upload_chunk_kb: 256
  metadata_max_len: 200         # characters per text field (title, artist, genre, source)
  metadata_year_range: [1900, 2100]
  page_size_default: 100        # GET /songs
  page_size_max: 500

blind_test:                     # M5, docs/DATA_RESEARCH.md section 4
  songs_per_group:              # 12 stimulus songs, 2-3 per genre group
    ambient_classical: 3
    rock_metal: 3
    electronic_dance: 2
    hiphop_rnb: 2
    folk_acoustic_jazz: 2
  max_per_artist: 1             # one stimulus song per artist
  clip_s: 20.0
  clip_start_fraction: 0.40     # clip starts at 40% of the song
  clip_fade_s: 0.5
  clip_lufs: -23.0              # equal loudness so level is not a cue
  clip_kbps: 128
  n_options: 4                  # 1 correct + 3 foils
  same_genre_trials: 6          # half the trials include one same-genre foil
  n_participant_plans: 60       # participant numbers 1..N each get a fixed plan
  signature_px: 480
  gate_accuracy: 0.50           # mean accuracy needed at the gate
  gate_alpha: 0.05              # one-sided binomial test vs chance

ui:                             # app chrome that is not part of any analysis or render output
  mural:                        # the loading mural (D-052); index.html carries a copy, a unit test keeps them equal
    cols: 12
    rows: 8
    lightness: [0.2, 0.32]      # OKLCH tile lightness range (hue comes from color.hue)
    chroma: [0.06, 0.11]
    stagger_ms: 55              # per diagonal step; one full sweep = (cols + rows - 2) x stagger + 36 % of the period
    period_ms: 2600
    delay_ms: 400               # in-app gate (3D chunk): never shows for loads shorter than this ...
    min_ms: 600                 # ... stays at least this once shown ...
    fade_ms: 300                # ... and fades out over this
    boot_delay_ms: 0            # cold start (D-061): shown from the first paint ...
    boot_min_ms: 2350           # ... for one full sweep (1,930 ms) plus a 420 ms hold on the finished mural ...
    boot_min_reduced_ms: 1000   # ... (reduced motion: the still mural this long) ...
    boot_fade_ms: 450           # ... then this fade
    skip_after_ms: 600          # a key, click or tap after this starts the fade early (once the app has painted)
  trail_graph:                  # the live trail chart (D-062): loudness (dBFS) x brightness (Hz), calibration ranges
    trail_s: 2.0                # trail window; equals live.trail.length_s (a unit test keeps them equal)
    loudness_ticks_dbfs: [-40, -30, -20]
    brightness_ticks_hz: [500, 1000, 2000, 4000]
    line_width_px: 2.0
    dot_radius_px: 5.0
    trail_opacity: 0.9          # newest segment; older ones fade linearly to 0
    cloud_bins: 64              # whole-song density cloud: bins per axis ...
    cloud_sigma_bins: 1.2       # ... blurred by this ...
    cloud_opacity: 0.35         # ... drawn at this peak opacity
    hue_strip_px: 4.0           # the hue strip on the y axis (same mapping as the grid colours)
    alt_text_hz: 2.0            # the text alternative updates this often while playing
    pause_fade_ms: 400          # on pause the trail fades with the grid's ease-out
  maps_live:                    # the companion maps (phase 6, D-064): fixed per song, with a live "now" marker and reading pointers
    now_trail_s: 2.0            # features map: the current sound's ring leaves this much trail (= live.trail.length_s)
    playhead_px: 2.0            # playhead / crosshair width at 1x
    ring_px: 2.5                # features map: ring stroke at 1x
    time_ticks: 4               # time axis: this many intervals (start, quarters, end)
    bpm_ticks: [60, 90, 120, 180]
  landing:                      # the first landing (phase 5, D-063); scroll stays native (D-049)
    scroll_follow_s: 0.12       # the visuals follow a critically damped copy of scroll progress
    hero_to: 0.16               # beats, as fractions of the pinned track: hero (cursor reveal) ...
    disc_from: 0.16             # ... the card shrinks into the disc's label ...
    disc_full: 0.26             # ... the disc stands alone and turns with scroll ...
    disc_to: 0.44               # ... and gives the card back by ...
    live_from: 0.5              # ... the live grid (scroll-scrubbed) ...
    map_from: 0.76              # ... the structure map
    disc_card_scale: 0.42       # card size while it is the label (so the whole disc fits the stage)
    disc_turns: 1.25            # disc turns over disc_full..disc_to (scroll-scrubbed, never idle)
    disc_tilt_deg: 12.0         # the disc leans to the player disc's tilt once it turns (flat at the swap)
    headline_scale: 0.5         # the hero headline shrinks to this after the hero
    reveal_grid: 64             # cursor reveal: decay texture side (cells over the card) ...
    reveal_half_life_s: 1.5     # ... the painted trail halves in this time ...
    reveal_radius: 0.07         # ... brush radius as a share of the card side at rest ...
    reveal_speed_gain: 0.035    # ... plus this per card-side-per-second of pointer speed ...
    reveal_radius_max: 0.17     # ... capped here
    live_start_s: 8.0           # the live layer plays the sample from here ...
    live_span_s: 14.0           # ... looping over this span (silently, on the sample's own timeline)

performance:
  budget_analysis_s_per_4min: 30   # on an Apple M1 / 8 GB or comparable x86
  budget_peak_ram_gb: 1.5
  target_fps: 60
