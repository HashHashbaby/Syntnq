<!doctype html>
<meta charset="utf-8">
<title>glass chips prototype</title>
<style>
  html,body{margin:0;background:#000;color:#bbb;font:12px/1.4 ui-monospace,Consolas,monospace}
  canvas{display:block;background:#000}
</style>
<canvas id="c"></canvas>
<script>
"use strict";
// 32 x 32 translucent glass chips over the 64 x 64 analysis grid. Flat 2D discs, lit from behind.
// Passes: wave tank (ping-pong) -> chips (RGBA16F HDR) -> bloom -> composite (shoulder, dither, encode).
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', {antialias: false, alpha: false, preserveDrawingBuffer: false,
                                    powerPreference: 'high-performance'});
if (!gl) throw new Error('WebGL2 unavailable');
const extF = gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

const VS = `#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

const COMMON = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), f.x), mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), f.x), f.y);
}`;

// ------------------------------------------------------------------------------------------ wave tank
const FS_WAVE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uW;
uniform vec4 uSrc;     // x, y (cells), continuous emission amplitude, beat impulse amplitude
uniform vec4 uP0;      // dt, wave speed (cells/s), damping, source sigma (cells)
uniform vec4 uP1;      // current x, current y (cells/s), curl amplitude, curl scale
uniform vec4 uP2;      // time, limit, source gain, beat gain
uniform float uPaused, uBeatNow;
${COMMON}
vec2 curl(vec2 p, float t){
  float e = 0.35;
  float n1 = vnoise(p*uP1.w + vec2(0.0, t*0.07)), n2 = vnoise((p + vec2(0.0, e))*uP1.w + vec2(0.0, t*0.07));
  float n3 = vnoise((p + vec2(e, 0.0))*uP1.w + vec2(0.0, t*0.07));
  return vec2(n2 - n1, -(n3 - n1)) / e;
}
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec2 pos = vec2(c) + 0.5;
  float dt = uP0.x;
  vec2 vel = uP1.xy + curl(pos, uP2.x) * uP1.z * length(uP1.xy);
  vec2 back = pos - vel * dt;
  vec4 s = texture(uW, back / 64.0);
  float h = s.r, v = s.g;
  ivec2 hi = ivec2(63);
  float hl = texelFetch(uW, clamp(c + ivec2(-1, 0), ivec2(0), hi), 0).r;
  float hr = texelFetch(uW, clamp(c + ivec2( 1, 0), ivec2(0), hi), 0).r;
  float hd = texelFetch(uW, clamp(c + ivec2(0, -1), ivec2(0), hi), 0).r;
  float hu = texelFetch(uW, clamp(c + ivec2(0,  1), ivec2(0), hi), 0).r;
  float lap = hl + hr + hd + hu - 4.0 * h;
  float edge = min(min(pos.x, 64.0 - pos.x), min(pos.y, 64.0 - pos.y));
  float sponge = (1.0 - smoothstep(0.0, 7.0, edge)) * 3.5;                 // open water: waves leave the tank
  float damp = uP0.z * (1.0 + 3.0*uPaused) + sponge;
  v += (uP0.y*uP0.y*lap - damp*v) * dt;
  vec2 d = pos - uSrc.xy - 0.5;
  float g = exp(-dot(d, d) / (2.0*uP0.w*uP0.w));
  v += (uP2.z * uSrc.z * g * 10.0) * dt * (1.0 - uPaused);                 // loudness-proportional emission
  v += uP2.w * uSrc.w * g * 14.0 * uBeatNow * (1.0 - uPaused);             // beat ring impulse (one substep)
  h += v * dt;
  h = clamp(h, -uP2.y, uP2.y);
  o = vec4(h, v, 0.0, 1.0);
}`;

// ------------------------------------------------------------------------------------------ chips
const FS_CHIP = `#version 300 es
precision highp float;
precision highp int;
in vec2 vUv; out vec4 o;
uniform sampler2D uLab;    // 64x64 RGB32F OKLab per analysis cell
uniform sampler2D uFlow;   // 64x64 RGB32F (dx, dy, value) of the smooth response field
uniform sampler2D uCorr;   // 32x32 RGB32F mean-preserving OKLab correction per chip
uniform sampler2D uOcc;    // 32x32 RGB32F occupancy in r
uniform sampler2D uWave;   // 64x64 RGBA16F wave height (r)
uniform sampler2D uHaze;   // 64x64 RGB32F blurred OKLab
uniform float uSide, uLenses, uCells, uMargin;
uniform float uRadius, uOverlap, uOverlapR, uRmin, uRmax, uRmaxOv, uRadMode, uOccAmt;
uniform float uSwirl, uSwirlPow, uAbsDark, uAbsSat, uRingStart, uRingDark, uRingSat, uAvgQ;
uniform float uGrain, uVeins, uVeinScale, uBacklight, uHazeK, uGlintK, uGlintSize, uGlintOff;
uniform vec2  uLightXY;
uniform float uFlat, uLive, uWaveOn, uTime, uLoud, uSwirlFlow, uSwirlLoud, uDriftHz;
uniform float uModT, uModV, uModR, uSlopeGain, uNoGlint, uOvComp, uEdgeDir;
uniform vec3  uCrop;
uniform float uBackK, uBackScale, uBackDrift, uTransGain, uHiK, uHiSharp, uFarK, uBandK;
uniform vec2  uBackOff, uShadowOff;
uniform vec3  uBg;
uniform float uShadowK, uShadowBlur;
${COMMON}
vec3 labToLin(vec3 c){
  float l_ = c.x + 0.3963377774*c.y + 0.2158037573*c.z;
  float m_ = c.x - 0.1055613458*c.y - 0.0638541728*c.z;
  float s_ = c.x - 0.0894841775*c.y - 1.2914855480*c.z;
  float l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
  return vec3( 4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
              -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
              -0.0041960863*l - 0.7034186147*m + 1.7076147010*s);
}
vec4 crW(float t){
  float t2 = t*t, t3 = t2*t;
  return vec4(-0.5*t3 + t2 - 0.5*t, 1.5*t3 - 2.5*t2 + 1.0, -1.5*t3 + 2.0*t2 + 0.5*t, 0.5*t3 - 0.5*t2);
}
vec3 labAt(ivec2 c){ c = clamp(c, ivec2(0), ivec2(int(uCells)-1)); return texelFetch(uLab, c, 0).rgb; }
vec3 field(vec2 pc){
  vec2 g = pc - 0.5; vec2 i0 = floor(g); vec2 t = g - i0;
  vec4 wx = crW(t.x), wy = crW(t.y);
  vec3 acc = vec3(0.0);
  ivec2 b = ivec2(i0) - ivec2(1);
  for (int dy = 0; dy < 4; dy++)
    for (int dx = 0; dx < 4; dx++)
      acc += wx[dx]*wy[dy]*labAt(b + ivec2(dx, dy));
  return acc;
}
vec2 swirlWarp(vec2 q, float angle0, float R){
  float r = length(q);
  float s = clamp(r/R, 0.0, 1.0);
  float a = angle0 * pow(1.0 - s, uSwirlPow);
  float c = cos(a), sn = sin(a);
  return vec2(q.x*c - q.y*sn, q.x*sn + q.y*c);
}
float waveH(vec2 cellsPos){ return texture(uWave, cellsPos / uCells).r * uWaveOn; }

// coloured light behind the panel: blurred song colours, offset so it differs from the chip body,
// modulated by a slow cloud pattern. Used through the chips and in the gaps.
vec3 backdropAt(vec2 pc){
  vec3 bl = texture(uHaze, (pc + uBackOff) / uCells).rgb;
  vec2 drift = vec2(uTime*uBackDrift, -uTime*uBackDrift*0.6);
  float cloud = 0.55*vnoise(pc / uBackScale + drift) + 0.45*vnoise(pc / (uBackScale*0.45) - drift*1.7 + 7.3);
  float k = 0.70 + 0.65*cloud;
  return max(labToLin(vec3(bl.x*k, bl.yz*(1.0 + 0.35*(cloud - 0.5)))), 0.0) * uBacklight;
}

// one chip: returns (transmittance colour, coverage); glint (additive highlights) out
vec4 chipEval(vec2 id, vec2 f, out vec3 glint){
  glint = vec3(0.0);
  if (id.x < 0.0 || id.y < 0.0 || id.x >= uLenses || id.y >= uLenses) return vec4(1.0, 1.0, 1.0, 0.0);
  float block = uCells / uLenses;
  vec2 cc = (id + 0.5) * block;
  float occ = texelFetch(uOcc, ivec2(id), 0).r;
  float r0 = (uOverlap > 0.5) ? uOverlapR : uRadius;
  if (uRadMode > 0.5) r0 *= sqrt(max(1.0 + uOccAmt*(2.0*occ - 1.0), 0.2));
  float wc = clamp(waveH(cc) / 0.6, -1.0, 1.0);
  float R = clamp(r0 * (1.0 + uModR*wc), uRmin, (uOverlap > 0.5) ? uRmaxOv : uRmax);
  float r = length(f);
  float u = r / R;
  float d = r - R;
  float aa = max(fwidth(d)*0.75, 1e-5);
  float cover = 1.0 - smoothstep(-aa, aa, d);
  if (cover <= 0.0) return vec4(1.0, 1.0, 1.0, 0.0);

  vec3 flow = texelFetch(uFlow, clamp(ivec2(cc), ivec2(0), ivec2(int(uCells)-1)), 0).rgb;
  float ang = radians(uSwirl);
  if (uLive > 0.5) {
    float ph = sin(6.2831853*uDriftHz*uTime + 6.2831853*hash12(id))*0.25*flow.z;
    ang += uSwirlFlow*flow.z + uSwirlLoud*uLoud + ph;
  }
  vec3 corr = texelFetch(uCorr, ivec2(id), 0).rgb;
  vec3 lab = field(cc + swirlWarp(f, ang, R)*block) + corr;

  // fine glass texture: grain + veins steered by the sub-cell colours (deterministic, mean zero)
  vec2 q = f / R;
  float grain = (vnoise(q*14.0 + id*5.31) - 0.5) * 2.0 * uGrain;
  float steer = lab.y * 6.0 + lab.z * 4.0;
  float warpv = 2.6*vnoise(q*1.7 + id*1.7) + 1.4*vnoise(q*3.9 + id*0.9);
  float vein = sin(dot(q, vec2(0.80, 0.60))*uVeinScale*0.9 + steer*2.0 + warpv*3.1);
  float tex = grain + uVeins * vein * (1.0 - 0.35*u);

  // absorption: lighter centre, denser and more saturated edge; thick-glass ring (mean preserving)
  float p = u*u;
  float ring = smoothstep(uRingStart, 1.0, u);
  // directional thick edge: denser on the lit side, lighter where the light exits (zero-mean in angle)
  float side = dot(f / max(r, 1e-5), normalize(uLightXY));
  float Lmul = 1.0 - uAbsDark*(p - 0.5) - uRingDark*(ring - uAvgQ)*(1.0 + uEdgeDir*side);
  float Cmul = 1.0 + uAbsSat*(p - 0.5) + uRingSat*(ring - uAvgQ)*(1.0 - 0.5*uEdgeDir*side);
  float L = lab.x * Lmul * (1.0 + tex) * (1.0 + uOvComp);
  vec2 ab = lab.yz * Cmul;

  if (uLive > 0.5 && uWaveOn > 0.5) {                                   // wave modulation, bounded
    float hw = clamp(waveH((id + 0.5 + f) * block) / 0.6, -1.0, 1.0);
    L *= 1.0 + uModT * hw;
    ab *= 1.0 + uModV * hw;
  }
  vec3 col = max(labToLin(vec3(L, ab)), 0.0) * uBacklight;
  if (uBackK > 0.0) {                                                   // light field seen through the glass
    float thin = clamp(uBackK * (1.0 + uTransGain*(lab.x - 0.55)*2.0), 0.0, 0.6);
    col = mix(col, backdropAt((id + 0.5 + f) * block), thin);
  }

  // one small soft neutral glint, top-left; travels with the wave slope
  vec2 slope = vec2(0.0);
  if (uLive > 0.5 && uWaveOn > 0.5) {
    vec2 pc = (id + 0.5 + f) * block;
    slope = vec2(waveH(pc + vec2(0.5, 0.0)) - waveH(pc - vec2(0.5, 0.0)),
                 waveH(pc + vec2(0.0, 0.5)) - waveH(pc - vec2(0.0, 0.5)));
  }
  // glint = a short soft sliver on the rim edge facing the light (flat glass catching light);
  // the wave slope rotates it, so highlights slide like light on water
  vec2 ldir = normalize(normalize(uLightXY) - slope * uSlopeGain * 6.0);
  float facing = max(dot(f / max(r, 1e-5), ldir), 0.0);
  float band = smoothstep(uGlintOff - uGlintSize, uGlintOff, u) * (1.0 - smoothstep(uGlintOff, uGlintOff + uGlintSize, u));
  float gl1 = uGlintK * pow(facing, 6.0) * band;
  vec2 ld = normalize(uLightXY);
  float fc = max(dot(f / max(r, 1e-5), ld), 0.0);
  float arc = pow(fc, uHiSharp) * smoothstep(0.76, 0.86, u) * (1.0 - smoothstep(0.90, 0.985, u));
  float far = pow(max(-dot(f / max(r, 1e-5), ld), 0.0), 2.5) * smoothstep(0.58, 0.80, u) * (1.0 - smoothstep(0.86, 0.98, u));
  vec2 qq = f / R;
  float s1 = dot(qq, normalize(vec2(1.0, 1.0)));
  float rb = exp(-pow((s1 + 0.34)/0.13, 2.0)) + 0.6*exp(-pow((s1 + 0.04)/0.05, 2.0));
  rb *= (1.0 - smoothstep(0.80, 1.0, u)) * smoothstep(0.0, 0.25, u + 0.2);
  vec3 farCol = max(labToLin(vec3(min(lab.x*1.18, 0.95), lab.yz*1.7)), 0.0);
  glint = (1.0 - uNoGlint) * (vec3(gl1 + uHiK*arc + uBandK*rb) + uFarK*far*farCol);
  return vec4(col, cover);
}

void main(){
  vec2 uvImg = vec2(vUv.x, 1.0 - vUv.y);
  vec2 frag = uCrop.xy + uvImg * uCrop.z;
  float P = uSide / (uLenses + 2.0*uMargin);
  vec2 l = frag / P - uMargin;
  vec2 idx = floor(l);
  vec2 f = l - idx - 0.5;
  float block = uCells / uLenses;

  vec3 T = vec3(1.0); float unc = 1.0; vec3 glintSum = vec3(0.0);
  if (uFlat > 0.5) {
    // flat reference chips: plain discs of the data colour (no texture, no absorption, no glint)
    vec2 id = clamp(idx, 0.0, uLenses - 1.0);
    vec2 cc = (id + 0.5) * block;
    float R = uRadius;
    float r = length(f);
    float aa = max(fwidth(r - R)*0.75, 1e-5);
    float cover = 1.0 - smoothstep(-aa, aa, r - R);
    vec3 lab = field(cc + swirlWarp(f, radians(uSwirl), R)*block) + texelFetch(uCorr, ivec2(id), 0).rgb;
    T = max(labToLin(lab), 0.0) * uBacklight; unc = 1.0 - cover;
    if (idx.x < 0.0 || idx.y < 0.0 || idx.x >= uLenses || idx.y >= uLenses) unc = 1.0;
  } else if (uOverlap > 0.5) {
    for (int k = 0; k < 5; k++) {
      vec2 off = (k == 0) ? vec2(0.0) : (k == 1) ? vec2(1.0, 0.0) : (k == 2) ? vec2(-1.0, 0.0) : (k == 3) ? vec2(0.0, 1.0) : vec2(0.0, -1.0);
      vec3 gg;
      vec4 v = chipEval(idx + off, f - off, gg);
      T *= mix(vec3(1.0), v.rgb, clamp(v.a * 20.0, 0.0, 1.0));   // full colour once covered
      unc *= 1.0 - v.a;
      glintSum += gg * v.a;
    }
  } else {
    vec3 gg;
    vec4 v = chipEval(idx, f, gg);
    T = v.rgb; unc = 1.0 - v.a; glintSum = gg * v.a;
  }
  float covered = 1.0 - unc;
  vec3 chipRGB = T * covered;
  vec3 base = uBg;
  if (uShadowK > 0.0) {                       // coloured light cast onto the surface by the chips up-left
    float sh = 0.0; vec3 tint = vec3(0.0);
    for (int k = 0; k < 4; k++) {
      vec2 o = vec2(float(k & 1), float(k >> 1));
      vec2 id2 = idx - o;
      if (id2.x < 0.0 || id2.y < 0.0 || id2.x >= uLenses || id2.y >= uLenses) continue;
      float d = length(f + o - uShadowOff);
      float m = 1.0 - smoothstep(uRadius - uShadowBlur, uRadius + uShadowBlur, d);
      vec3 cl = max(labToLin(field((id2 + 0.5)*block) + texelFetch(uCorr, ivec2(id2), 0).rgb), 0.0);
      sh += m; tint += m * cl / max(max(cl.r, max(cl.g, cl.b)), 1e-3);
    }
    tint /= max(sh, 1e-3);
    base = uBg * mix(vec3(1.0), 0.60 + 0.40*tint, uShadowK * min(sh, 1.0));
  }
  vec3 haze = vec3(0.0);
  if (uHazeK > 0.0) {
    vec2 pc = clamp(frag / P - uMargin, 0.0, uLenses) * block;
    if (uBackK > 0.0) haze = backdropAt(pc) * uHazeK;
    else haze = max(labToLin(texture(uHaze, pc / uCells).rgb), 0.0) * uHazeK;
  }
  vec3 outc = base * unc + chipRGB + haze * (1.0 - 0.85*covered) + glintSum * covered;
  o = vec4(max(outc, 0.0), covered);
}`;

const FS_BLOOM = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uT; uniform vec2 uTexel; uniform vec2 uDir; uniform float uThreshold; uniform float uFirst;
void main(){
  float w[5] = float[](0.2270270270, 0.1945945946, 0.1216216216, 0.0540540541, 0.0162162162);
  vec3 c = vec3(0.0);
  for (int i = -4; i <= 4; i++) {
    vec3 s = texture(uT, vUv + uDir*uTexel*float(i)).rgb;
    if (uFirst > 0.5) s = max(s - uThreshold, 0.0);
    c += s * w[abs(i)];
  }
  o = vec4(c, 1.0);
}`;

const FS_COMPOSITE = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uHdr, uBloom;
uniform float uBloomK, uExposure, uDither, uP3, uSide;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 shoulder(vec3 x){
  const float k = 0.92;   // above the data range: colours are never compressed, only highlights
  vec3 t = (x - k) / (1.0 - k);
  return mix(x, k + (1.0 - k)*(1.0 - exp(-max(t, 0.0))), step(k, x));
}
vec3 oetf(vec3 c){ return mix(c*12.92, 1.055*pow(max(c,0.0), vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
void main(){
  vec4 h = texture(uHdr, vUv);
  vec3 c = h.rgb + texture(uBloom, vUv).rgb * uBloomK;
  c = shoulder(c * uExposure);
  if (uP3 > 0.5) {
    c = mat3(0.8224621, 0.0331941, 0.0170827, 0.1775380, 0.9668058, 0.0723974, 0.0000000, 0.0000000, 0.9105199) * c;
  }
  vec3 e = oetf(clamp(c, 0.0, 1.0));
  vec2 fc = vec2(vUv.x, 1.0 - vUv.y) * uSide;
  float n = hash12(fc) + hash12(fc + 17.3) - 1.0;
  e += n * uDither / 255.0;
  o = vec4(e, 1.0);
}`;

// ------------------------------------------------------------------------------------------ GL setup
function program(fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const pWave = program(FS_WAVE), pChip = program(FS_CHIP), pBloom = program(FS_BLOOM), pComp = program(FS_COMPOSITE);
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function floatTex(data, size) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB32F, size, size, 0, gl.RGB, gl.FLOAT, data);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
                        [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  return t;
}
function nearestTex(data, size) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB32F, size, size, 0, gl.RGB, gl.FLOAT, data);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST],
                        [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  return t;
}
function target(w, h, filter = gl.LINEAR) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, filter], [gl.TEXTURE_MAG_FILTER, filter],
                        [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  return {t, f, w, h};
}

// ------------------------------------------------------------------------------------------ CPU helpers
function crw(t) { const t2 = t*t, t3 = t2*t;
  return [-0.5*t3 + t2 - 0.5*t, 1.5*t3 - 2.5*t2 + 1.0, -1.5*t3 + 2.0*t2 + 0.5*t, 0.5*t3 - 0.5*t2]; }

// ------------------------------------------------------------------------------------------ state
const S = {params: null, index: null, songs: {}, side: 0, hdr: null, b1: null, b2: null,

async function init() {

  cv.style.width = side + 'px'; cv.style.height = side + 'px';

async function save(name) {

}
const px = new Uint8Array(4);

window.LENS = {
  init,
  async reloadParams() { S.params = await (await fetch('/params.json')).json(); },
  async still(song, side, name, o = {}) {
    resize(side); stillFields(song, o);
    waveReset();
    drawChips(Object.assign({}, o, {live: false, waves: false}));
    sync(); return save(name);

  // sequential live frames: the wave tank is stepped from the clip start, so captures are deterministic

    } else if (reduced && f.reduced_motion === 'follow') {

      for (let i = 0; i < 64*64; i++) w[i*4] = Math.max(-1, Math.min(1, (fl[i*3 + 2] - 0.15) * 1.2));

    sync(); return name ? save(name) : true;

  async liveClip(song, side, from, to, prefix, o = {}) {

    return to - from;
