name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Determinism scope: byte-identical outputs are asserted only within one machine
# (two runs inside the same leg). Across machines/legs the contract is values
# within 1e-5, so no test compares bytes across OSes.

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      - name: Install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg libsndfile

      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Verify ffmpeg is on PATH
        shell: bash
        run: ffmpeg -version | head -n 1

      - uses: astral-sh/setup-uv@v6

      - name: Sync dependencies (lockfile must be current)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Parity fixtures and synthetic samples from the Python reference
        run: |
          uv run python scripts/make_web_fixtures.py
          uv run python scripts/make_web_samples.py --synthetic
          uv run python scripts/make_web_icons.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: End-to-end, parity and UI checklist
        run: npx playwright test
        working-directory: web
      - name: No Apple assets or fonts in the bundle
        run: |
          npx vite build
          ! grep -R -l -i -E "San Francisco|SF Symbols|SF Pro" dist || (echo 'Apple asset names found' && exit 1)
          ! find dist -name '*.woff*' -o -name '*.ttf' -o -name '*.otf' | grep .
        working-directory: web
