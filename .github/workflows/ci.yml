name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Determinism scope: byte-identical outputs are asserted only within one machine
# (two runs inside the same leg). Across machines/legs the contract is values
# within 1e-5, so no test compares bytes across OSes.

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      - name: Install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg libsndfile

      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Verify ffmpeg is on PATH
        shell: bash
        run: ffmpeg -version | head -n 1

      - uses: astral-sh/setup-uv@v6

      - name: Sync dependencies (lockfile must be current)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest -v
